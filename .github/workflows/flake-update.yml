name: Daily flake update

on:
  schedule:
    - cron: "30 22 * * *" # 05:30 WIB daily
  workflow_dispatch: {}

# One update PR at a time; new run supersedes a still-open one.
concurrency:
  group: daily-flake-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: nix flake update
        run: nix flake update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: flake-update
          delete-branch: true
          title: "chore: daily nix flake update"
          commit-message: "chore: daily nix flake update"
          labels: |
            dependencies
            github_actions:dependencies

          body: |
            Automated daily `nix flake update` by GitHub Actions.

            Review flake.lock diff, then merge.

      - name: PR info
        run: |
          echo "pr=${{ steps.cpr.outputs.pull-request-number }}"
          echo "url=${{ steps.cpr.outputs.pull-request-url }}"
          echo "updated=${{ steps.cpr.outputs.pr-updated }}" >> "$GITHUB_STEP_SUMMARY"
