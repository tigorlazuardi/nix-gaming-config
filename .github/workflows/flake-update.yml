name: Daily flake update

on:
  schedule:
    - cron: "30 22 * * *" # 05:30 WIB daily
  workflow_dispatch: {}

# One update at a time; new run supersedes a still-running one.
concurrency:
  group: daily-flake-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: nix flake update
        run: nix flake update

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet flake.lock; then
            echo "flake.lock already up to date, nothing to commit"
            exit 0
          fi
          git add flake.lock
          git commit -m "chore: daily nix flake update"
          git push
